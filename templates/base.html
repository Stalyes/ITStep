<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Railway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-wrap">
            <a href="/" class="brand-logo">STEP RAILWAY</a>
            <a href="/check_ticket" class="check-ticket-btn">ბილეთის შემოწმება</a>
        </div>
    </header>

    <div class="page-body">
        <main class="site-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Step Railway. ყველა უფლება დაცულია.</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

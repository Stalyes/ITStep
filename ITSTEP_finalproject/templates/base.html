{% load static %}
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Railway</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top-gradient-bg">
        <header class="site-header">
            <div class="header-wrap">
                <a href="/" class="brand-logo">STEP RAILWAY</a>

                <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                    {% if user.is_authenticated %}
                        <span style="font-weight: 600; color: #1a2540;">გამარჯობა, {{ user.username }}</span>
                        <a href="/logout/" class="check-ticket-btn" style="background: #dc3545;">
                            <i class="fas fa-sign-out-alt"></i> გასვლა
                        </a>
                    {% else %}
                        <a href="/login/" class="check-ticket-btn" style="background: #f0f2f5; color: #1a2540; border: 1px solid #e0e5ed;">
                            შესვლა
                        </a>
                        <a href="/register/" class="check-ticket-btn">
                            რეგისტრაცია
                        </a>
                    {% endif %}

                    <a href="/check_ticket" class="check-ticket-btn">
                        ბილეთის შემოწმება
                    </a>
                </div>
            </div>
        </header>

        <main class="site-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Step Railway. ყველა უფლება დაცულია.</p>
    </footer>

    <script src="{% static 'app.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

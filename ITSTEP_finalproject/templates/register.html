{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-user-plus"></i> რეგისტრაცია</h2>
</div>

<div class="check-ticket-container" style="max-width: 450px;">
    <form action="{% url 'register' %}" method="POST" class="check-form">
        {% csrf_token %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-error">
                    <i class="fas fa-exclamation-triangle"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="form-group">
            <label>მომხმარებლის სახელი</label>
            <input type="text" name="username" class="clean-input" required>
        </div>
        <div class="form-group" style="margin-top: 15px;">
            <label>ელფოსტა</label>
            <input type="email" name="email" class="clean-input" required>
        </div>
        <div class="form-group" style="margin-top: 15px;">
            <label>პაროლი</label>
            <input type="password" name="password" class="clean-input" required>
        </div>
        <div class="form-group" style="margin-top: 15px;">
            <label>გაიმეორეთ პაროლი</label>
            <input type="password" name="confirm_password" class="clean-input" required>
        </div>

        <button type="submit" class="btn-register" style="margin-top: 25px;">
            ანგარიშის შექმნა
        </button>

        <p style="text-align: center; margin-top: 20px; color: #6a6a7a;">
            უკვე გაქვთ ანგარიში?
            <a href="{% url 'login' %}" style="color: #1e5fbf; font-weight: bold;">ავტორიზაცია</a>
        </p>
    </form>
</div>
{% endblock %}
